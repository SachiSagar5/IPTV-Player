name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean everything
        run: |
          rm -rf dist node_modules package-lock.json .tsbuildinfo .vite
          npm cache clean --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline=false

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          VITE_CORS_PROXY: 'https://api.allorigins.win/raw?url='

      - name: Verify build output
        run: |
          echo "=== Build output files ==="
          ls -la dist/assets/ | grep index
          echo "=== Checking for proxy URL in build ==="
          # Look for the actual proxy endpoint value in the built JS
          grep -r "/api/stream" dist/ && echo "FOUND" || (echo "NOT FOUND - BUILD FAILED" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4