name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          echo "=== Checking source files ==="
          grep -r "BUILD_MARKER" src/ || echo "MARKER NOT FOUND"
          echo "=== Checking PROXY_ENDPOINT ==="
          grep -r "PROXY_ENDPOINT" src/ || echo "PROXY_ENDPOINT NOT FOUND"
          echo "=== Checking iptv-cors-proxy ==="
          grep -r "iptv-cors-proxy" src/ || echo "iptv-cors-proxy NOT FOUND"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline=false

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          BUILD_ID: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4