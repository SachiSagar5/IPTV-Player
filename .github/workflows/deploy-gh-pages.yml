name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean
        run: rm -rf dist node_modules

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          BUILD_TIMESTAMP: ${{ github.run_id }}

      - name: Verify build output
        run: |
          echo "=== Build output files ==="
          ls -la dist/assets/ | grep index
          echo "=== Checking for proxy URL in build ==="
          if grep -r "iptv-cors-proxy" dist/; then
            echo "SUCCESS: Proxy URL found in build"
          else
            echo "FAILURE: Proxy URL NOT found in build"
            echo "=== Searching for PROXY_ENDPOINT ==="
            grep -r "PROXY_ENDPOINT" dist/ || echo "Not found"
            echo "=== Searching for VERIFY_BUILD ==="
            grep -r "VERIFY_BUILD" dist/ || echo "Not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4