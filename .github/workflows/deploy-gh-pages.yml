name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Install dependencies
        run: npm ci --prefer-offline=false --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'

      - name: Verify source before build
        run: |
          echo "=== Checking VideoPlayer.tsx ==="
          head -50 src/components/player/VideoPlayer.tsx || echo "FILE NOT FOUND"
          echo "=== Checking hlsEngine.ts ==="
          head -50 src/services/hls/hlsEngine.ts || echo "FILE NOT FOUND"

- name: Verify build output
        run: |
          echo "=== Dist folder ==="
          ls -la dist/assets/ | grep index
          echo "=== Checking for proxy URL in build ==="
          grep -r "iptv-cors-proxy" dist/ || echo "NOT FOUND IN DIST"
          grep -r "BUILD_MARKER" dist/ || echo "MARKER NOT FOUND IN DIST"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4