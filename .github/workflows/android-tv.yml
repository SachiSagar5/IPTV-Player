# Debug APK for Android TV / Google TV / Fire TV.
#
# Runs on every push to main. The whole native build happens here: no Android
# SDK, JDK, Gradle or Capacitor CLI is needed on a contributor's machine, and
# the `android/` project is never committed (see scripts/prepare-android-tv.mjs).
name: Android TV debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build IPTV-TV-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires >=22. The Vite build target is es2022, so
          # this is the floor for both.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build the web bundle
        # CAPACITOR_BUILD drops vite-plugin-pwa, so the APK ships no service
        # worker or Workbox runtime: in a WebView the bundle is already local
        # and a SW has nothing to refresh.
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.13 requires 17+; 21 is the current LTS.
          java-version: '21'

      - name: Install the Capacitor CLI (build-time only)
        # Version is read from the installed @capacitor/core so the CLI and the
        # runtime plugin can never drift apart, and so bumping the dependency in
        # package.json needs no edit here.
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          echo "Using Capacitor $CAP_VERSION"
          npm install --no-save "@capacitor/cli@$CAP_VERSION" "@capacitor/android@$CAP_VERSION"

      - name: Generate the Android project
        env:
          # Non-interactive: the CLI must never wait on a prompt in CI.
          CI: 'true'
        run: npx cap add android

      - name: Sync the web bundle into the project
        # Must come before prepare-android-tv.mjs, which relies on the file this
        # step writes and whose output would otherwise be at risk of being
        # rewritten afterwards.
        env:
          CI: 'true'
        run: npx cap sync android

      - name: Make it an Android TV app
        run: node scripts/prepare-android-tv.mjs

      - name: Set up the Android SDK
        # Replaces android-actions/setup-android, which failed this workflow's
        # first run at the point it was the only failing step — before any of
        # the app's own code was involved. The hosted runner already ships the
        # SDK, so all that is actually needed is to accept the licences and
        # install the packages this project asks for. Depending on the
        # preinstalled SDK removes a third-party action from the critical path
        # rather than replacing it with another.
        #
        # It runs after `cap add android` so the versions can be read out of the
        # generated project rather than hardcoded here. A Capacitor upgrade that
        # moves compileSdk then cannot leave this building against the wrong
        # platform: nothing is repeated in two places to drift.
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::No Android SDK on this runner (ANDROID_HOME='${ANDROID_HOME:-}')"
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using SDK at $ANDROID_HOME via $SDKMANAGER"

          COMPILE=$(sed -n 's/^ *compileSdkVersion *= *\([0-9][0-9]*\).*/\1/p' android/variables.gradle)
          [ -n "$COMPILE" ] || { echo "::error::Could not read compileSdkVersion"; exit 1; }
          echo "Project asks for compileSdk $COMPILE"

          # `yes` answers the prompt. Without this, every sdkmanager call below
          # fails on an unaccepted licence, and `yes` itself dies of SIGPIPE the
          # moment sdkmanager stops reading, so the exit status is discarded.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools" "platforms;android-$COMPILE"

          # Best effort: AGP downloads its own build-tools when the licences are
          # accepted, so a package name that does not exist must not fail the
          # build. The verify step below uses whatever did land.
          "$SDKMANAGER" --install "build-tools;$COMPILE.0.0" \
            || echo "::warning::build-tools;$COMPILE.0.0 unavailable, leaving it to AGP"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        # The template always emits app-debug.apk. Renaming here means the
        # download a user gets says what it is, and the artifact name is
        # stable for anything downstream that fetches it.
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IPTV-TV-debug.apk

      - name: Verify it is a real, signed APK
        # A green Gradle exit is not proof the artifact is installable: aapt
        # reports the manifest as parsed, and apksigner confirms a signature
        # exists. Both are cheap and catch a genuinely broken output.
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" \
            dump badging IPTV-TV-debug.apk | head -20
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs IPTV-TV-debug.apk | head -10

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-TV-debug
          path: IPTV-TV-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Publishes the APK somewhere a browser can download without a login.
  #
  # Kept in a second job rather than a final step in `apk` for two reasons. The
  # `apk` job runs `npm ci` and a Gradle build of the checked-out code, so it
  # holds a token that could write; keeping `contents: write` out of that job
  # means a compromised dependency cannot publish anything. And the write token
  # only ever exists in a job gated on a push to main, so a fork's pull request
  # cannot reach it — `pull_request` from a fork gets a read-only token anyway,
  # but the `if` means the step is not even attempted.
  publish:
    name: Publish rolling APK release
    needs: apk
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-TV-debug
          path: dist-apk

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the app's download button points at. Changing it here means
          # changing it in src/tv/apkDownload.ts too.
          TAG: apk-latest
        run: |
          # Release *assets* are served anonymously; Actions artifacts are not,
          # and they expire. The app's download button can only work against the
          # former, which is the entire reason this job exists.
          #
          # A prerelease so that `/releases/latest` keeps resolving to the newest
          # real `v*` tag once android-release.yml starts publishing those.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest Android TV build" \
            --notes "Rebuilt automatically from \`main\`. Commit [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Not a tagged release — see the [\`v*\` releases](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases) for those."

          gh release upload "$TAG" dist-apk/IPTV-TV-debug.apk --clobber

      - name: Confirm the download URL resolves
        # The app links to releases/download/apk-latest/IPTV-TV-debug.apk. A
        # release that was created but whose asset upload failed would leave a
        # button in the UI pointing at a 404, so the link is followed for real
        # rather than assumed.
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/IPTV-TV-debug.apk"
          CODE=$(curl -sSL -o /dev/null -w '%{http_code}' "$URL")
          echo "GET $URL -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::The published download URL did not resolve (HTTP $CODE)"
            exit 1
          fi
